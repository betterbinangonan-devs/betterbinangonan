name: Deploy template

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  execute_deploy_to_environment:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout to repository
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: betterbinangonan-build-artifact
          path: ./.output/public

      - name: (${{ inputs.environment }}) Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflate/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: './output/public'
          command: pages deploy ./.output/public --project-name=betterbinangonan --branch=${{ github.ref_name }}