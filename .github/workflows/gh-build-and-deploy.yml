name: Build & Deploy to Github pages

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to deploy to
        required: true
        type: choice
        default: Development
        options:
          - Development
          - Production

permissions:
  contents: read

concurrency:
  group: preview-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload Artifact
    uses: ./.github/workflows/jobs/build-template.yml
    with:
      environment: ${{ github.event.inputs.environment}}

  deploy:
    name: Deploy to ${{ github.event.inputs.environment}}
    uses: ./.github/workflows/jobs/deploy-template.yml
    with:
      environment: ${{ github.event.inputs.environment}}
      